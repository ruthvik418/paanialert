AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PaaniAlert - early warning for unsafe drinking water

# Owner: A (Backend & alerts). Need a resource or permission? Ask A or open a PR and tag A.
# Every function uses CodeUri src/ so src/common/ can be imported everywhere.
# Libraries come from DependenciesLayer: run `python scripts/build_layer.py` before `sam build`.

Parameters:
  ModelEndpoint:
    Type: String
    Default: mantle
    AllowedValues: [mantle, runtime]
    Description: mantle = bedrock-mantle (OpenAI-compatible, short-lived tokens from the worker role); runtime = bedrock-runtime Converse
  MantleRegion:
    Type: String
    Default: ap-south-1
    Description: Region for bedrock-mantle model calls (ap-south-1 keeps message text in India)
  ModelIds:
    Type: String
    Default: qwen.qwen3-235b-a22b-2507,qwen.qwen3-vl-235b-a22b-instruct
    Description: Bedrock models for the agent, tried in order (ids for the chosen ModelEndpoint)
  BedrockRegion:
    Type: String
    Default: us-west-2
    Description: Region for runtime (Converse) model calls only
  ClaudeModel:
    Type: String
    Default: claude-haiku-5-5
    Description: Used only if SSM /paanialert/anthropic_api_key exists and Bedrock doesn't answer
  GeminiModel:
    Type: String
    Default: gemini-2.5-flash
    Description: Used only if SSM /paanialert/gemini_api_key exists and Bedrock doesn't answer
  BedrockRoleArn:
    Type: String
    Default: ""
    Description: Optional role in another account to run runtime (Converse) calls through
  TwilioWhatsAppFrom:
    Type: String
    Default: whatsapp:+14155238886
    Description: The Twilio sandbox number, or your approved WhatsApp sender
  EscalateAfterMin:
    Type: Number
    Default: 1440
    Description: Minutes an alert can stay open before the health officer is told (10 for demos)
  DashboardUrl:
    Type: String
    Default: https://main.dy95ki8l9ef8x.amplifyapp.com

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: src/
    Layers: [!Ref DependenciesLayer]
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        SSM_PREFIX: /paanialert/
        REPORTS_TABLE: !Ref ReportsTable
        CLUSTERS_TABLE: !Ref ClustersTable
        SUBSCRIBERS_TABLE: !Ref SubscribersTable
        NOTICES_TABLE: !Ref NoticesTable
        SESSIONS_TABLE: !Ref SessionsTable
        PREFERENCES_TABLE: !Ref PreferencesTable
        PROCESSED_TABLE: !Ref ProcessedMessagesTable
        CONTACTS_TABLE: !Ref ContactsTable
        AUDIT_TABLE: !Ref AuditLogTable
        ACTIVITY_TABLE: !Ref ActivityTable
        APP_QUOTA_TABLE: !Ref AppQuotaTable
        ADVISORIES_TABLE: !Ref AdvisoriesTable
        MEDIA_BUCKET: !Ref MediaBucket
        TWILIO_WHATSAPP_FROM: !Ref TwilioWhatsAppFrom
  HttpApi:
    CorsConfiguration:
      AllowOrigins: ["*"]
      AllowHeaders: [content-type, x-dashboard-key]
      AllowMethods: [GET, POST, OPTIONS]

Resources:
  PaaniApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # The web report app's routes are public, so cap them (shared by all callers, not per person).
      RouteSettings:
        "POST /app/report": { ThrottlingRateLimit: 1, ThrottlingBurstLimit: 5 }
        "POST /app/photo-url": { ThrottlingRateLimit: 1, ThrottlingBurstLimit: 5 }

  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: strands-agents, twilio, requests (built by scripts/build_layer.py)
      ContentUri: build/layer/
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete

  # Storage

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: report_id, AttributeType: S }
        - { AttributeName: geohash6, AttributeType: S }
        - { AttributeName: created_at, AttributeType: S }
      KeySchema:
        - { AttributeName: report_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: geo-time
          KeySchema:
            - { AttributeName: geohash6, KeyType: HASH }
            - { AttributeName: created_at, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  ClustersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: cluster_id, AttributeType: S }
      KeySchema:
        - { AttributeName: cluster_id, KeyType: HASH }

  SubscribersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: phone_hash, AttributeType: S }
        - { AttributeName: geohash6, AttributeType: S }
      KeySchema:
        - { AttributeName: phone_hash, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: by-cell
          KeySchema:
            - { AttributeName: geohash6, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  NoticesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: geohash6, AttributeType: S }
      KeySchema:
        - { AttributeName: geohash6, KeyType: HASH }

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: phone_hash, AttributeType: S }
      KeySchema:
        - { AttributeName: phone_hash, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  PreferencesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: phone_hash, AttributeType: S }
      KeySchema:
        - { AttributeName: phone_hash, KeyType: HASH }

  ProcessedMessagesTable:   # one row per handled Twilio MessageSid, so retries aren't processed twice
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: message_sid, AttributeType: S }
      KeySchema:
        - { AttributeName: message_sid, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  ContactsTable:   # full number per phone hash, read only through the audited contact endpoint
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: phone_hash, AttributeType: S }
      KeySchema:
        - { AttributeName: phone_hash, KeyType: HASH }

  AuditLogTable:   # one row each time an official reveals a reporter's number
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: audit_id, AttributeType: S }
      KeySchema:
        - { AttributeName: audit_id, KeyType: HASH }

  ActivityTable:   # every alert, message, email and status change, for the dashboard's Activity panel
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: activity_id, AttributeType: S }
      KeySchema:
        - { AttributeName: activity_id, KeyType: HASH }

  AdvisoriesTable:   # officials' "boil water" / "don't use" warnings for an area, until lifted
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: advisory_id, AttributeType: S }
      KeySchema:
        - { AttributeName: advisory_id, KeyType: HASH }

  AppQuotaTable:   # reports per web-app device per day (UTC), so one device can't flood the map
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: quota_id, AttributeType: S }
      KeySchema:
        - { AttributeName: quota_id, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:   # the report page uploads photos straight to S3 with a presigned PUT
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: [!Ref DashboardUrl, "http://localhost:5173"]
            AllowedHeaders: [content-type]
            MaxAge: 3000
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: delete-after-7-days
            Status: Enabled
            ExpirationInDays: 7

  # Incoming messages: webhook → queue → worker

  IncomingDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  IncomingQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IncomingDeadLetterQueue.Arn
        maxReceiveCount: 3

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: webhook.app.handler
      Timeout: 10
      Environment:
        Variables:
          INCOMING_QUEUE_URL: !Ref IncomingQueue
      Policies:
        - SQSSendMessagePolicy: { QueueName: !GetAtt IncomingQueue.QueueName }
        - SSMParameterReadPolicy: { ParameterName: paanialert/* }
      Events:
        WhatsApp:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: POST, Path: /whatsapp }

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: worker.app.handler
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          MODEL_ENDPOINT: !Ref ModelEndpoint
          MANTLE_REGION: !Ref MantleRegion
          MODEL_IDS: !Ref ModelIds
          BEDROCK_ROLE_ARN: !Ref BedrockRoleArn
          BEDROCK_REGION: !Ref BedrockRegion
          CLAUDE_MODEL: !Ref ClaudeModel
          GEMINI_MODEL: !Ref GeminiModel
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ReportsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ClustersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SubscribersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref PreferencesTable }
        - S3CrudPolicy: { BucketName: !Ref MediaBucket }
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:DeleteItem]
              Resource: !GetAtt ProcessedMessagesTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt ContactsTable.Arn
        - SSMParameterReadPolicy: { ParameterName: paanialert/* }
        - Statement:
            # Mantle uses short-lived tokens signed from this role, not the old stored API key.
            - Effect: Deny
              Action: ssm:GetParameter*
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/paanialert/bedrock_api_key"
            - Effect: Allow
              Action: bedrock-mantle:CreateInference
              Resource: !Sub "arn:${AWS::Partition}:bedrock-mantle:${MantleRegion}:${AWS::AccountId}:project/*"
            - Effect: Allow
              Action: bedrock-mantle:CallWithBearerToken
              Resource: "*"
              Condition:
                StringEquals: { "bedrock-mantle:BearerTokenType": SHORT_TERM }
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]   # ModelEndpoint=runtime
              Resource: "*"
            - Effect: Allow
              Action: sts:AssumeRole
              Resource: "*"
            - Effect: Allow
              Action: geo-places:ReverseGeocode
              Resource: "*"
      Events:
        Incoming:
          Type: SQS
          Properties:
            Queue: !GetAtt IncomingQueue.Arn
            BatchSize: 1
            ScalingConfig: { MaximumConcurrency: 5 }

  # Web report app: POST /app/report runs the same message handling as the worker, synchronously

  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.app_report.handler
      Timeout: 29            # HTTP API waits at most 30 s
      MemorySize: 1024
      Environment:
        Variables:
          MODEL_ENDPOINT: !Ref ModelEndpoint
          MANTLE_REGION: !Ref MantleRegion
          MODEL_IDS: !Ref ModelIds
          BEDROCK_ROLE_ARN: !Ref BedrockRoleArn
          BEDROCK_REGION: !Ref BedrockRegion
          CLAUDE_MODEL: !Ref ClaudeModel
          GEMINI_MODEL: !Ref GeminiModel
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: [!GetAtt ReportsTable.Arn, !GetAtt SessionsTable.Arn, !GetAtt PreferencesTable.Arn]
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:DeleteItem]
              Resource: !GetAtt ProcessedMessagesTable.Arn
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt AppQuotaTable.Arn
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]   # sign upload URLs; check the uploaded photo
              Resource: !Sub "${MediaBucket.Arn}/app-uploads/*"
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/paanialert/hmac_secret"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/paanialert/anthropic_api_key"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/paanialert/gemini_api_key"
            - Effect: Allow
              Action: bedrock-mantle:CreateInference
              Resource: !Sub "arn:${AWS::Partition}:bedrock-mantle:${MantleRegion}:${AWS::AccountId}:project/*"
            - Effect: Allow
              Action: bedrock-mantle:CallWithBearerToken
              Resource: "*"
              Condition:
                StringEquals: { "bedrock-mantle:BearerTokenType": SHORT_TERM }
            - Effect: Allow
              Action: geo-places:ReverseGeocode   # area name for the report's location
              Resource: "*"
      Events:
        Report:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: POST, Path: /app/report }
        PhotoUrl:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: POST, Path: /app/photo-url }

  # Clusters and alerts

  WardEngineerTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: PaaniAlert ward engineer

  HealthOfficerTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: PaaniAlert health officer

  ClusterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: cluster.app.handler
      Timeout: 120
      Environment:
        Variables:
          WARD_TOPIC_ARN: !Ref WardEngineerTopic
          HEALTH_TOPIC_ARN: !Ref HealthOfficerTopic
          ESCALATE_AFTER_MIN: !Ref EscalateAfterMin
          DASHBOARD_URL: !Ref DashboardUrl
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ReportsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ClustersTable }
        - DynamoDBReadPolicy: { TableName: !Ref SubscribersTable }
        - DynamoDBReadPolicy: { TableName: !Ref NoticesTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt WardEngineerTopic.TopicName }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt HealthOfficerTopic.TopicName }
        - SSMParameterReadPolicy: { ParameterName: paanialert/* }
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt ActivityTable.Arn
      Events:
        Every15Minutes:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)

  # Dashboard API

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.app.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ReportsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ClustersTable }
        - DynamoDBReadPolicy: { TableName: !Ref SubscribersTable }   # all-clear when a cluster is fixed
        - SSMParameterReadPolicy: { ParameterName: paanialert/* }
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt ContactsTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditLogTable.Arn
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:Scan]   # log status changes and all-clears; GET /activity
              Resource: !GetAtt ActivityTable.Arn
            - Effect: Allow
              Action: s3:GetObject          # presigned links to report photos (WhatsApp and web app)
              Resource: [!Sub "${MediaBucket.Arn}/media/*", !Sub "${MediaBucket.Arn}/app-uploads/*"]
            - Effect: Allow
              Action: dynamodb:UpdateItem   # officials' status on a report
              Resource: !GetAtt ReportsTable.Arn
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Scan]   # advisories
              Resource: !GetAtt AdvisoriesTable.Arn
      Events:
        Reports:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: GET, Path: /reports }
        ReportStatus:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: POST, Path: "/reports/{id}/status" }
        AdvisoriesList:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: GET, Path: /advisories }
        AdvisoryIssue:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: POST, Path: /advisories }
        AdvisoryPreview:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: POST, Path: /advisories/preview }
        AdvisoryLift:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: POST, Path: "/advisories/{id}/lift" }
        PublicAdvisories:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: GET, Path: /public/advisories }
        Clusters:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: GET, Path: /clusters }
        ClusterStatus:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: POST, Path: "/clusters/{id}/status" }
        ReportContact:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: POST, Path: "/reports/{id}/contact" }
        ReportPhoto:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: GET, Path: "/reports/{id}/photo" }
        Activity:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: GET, Path: /activity }
        PublicClusters:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: GET, Path: /public/clusters }

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.health.handler
      Events:
        Health:
          Type: HttpApi
          Properties: { ApiId: !Ref PaaniApi, Method: GET, Path: /health }

Outputs:
  ApiUrl:
    Description: Base URL for the dashboard API (set as VITE_API_URL)
    Value: !Sub "https://${PaaniApi}.execute-api.${AWS::Region}.amazonaws.com"
  WebhookUrl:
    Description: Paste into Twilio → WhatsApp sandbox settings → When a message comes in (POST)
    Value: !Sub "https://${PaaniApi}.execute-api.${AWS::Region}.amazonaws.com/whatsapp"
  MediaBucketName:
    Value: !Ref MediaBucket
  DeadLetterQueueUrl:
    Value: !Ref IncomingDeadLetterQueue
  WardEngineerTopicArn:
    Description: Subscribe the ward engineer's email here (SNS console → Create subscription)
    Value: !Ref WardEngineerTopic
  HealthOfficerTopicArn:
    Value: !Ref HealthOfficerTopic
  ClusterFunctionName:
    Description: Invoke this to run the cluster check now
    Value: !Ref ClusterFunction
