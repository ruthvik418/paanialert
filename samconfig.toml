version = 0.1

[default.global.parameters]
stack_name = "paanialert"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
region = "ap-south-1"
profile = "paani"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
s3_prefix = "paanialert"
confirm_changeset = false
fail_on_empty_changeset = false
# sam deploy keeps a parameter's previous value unless it's set here, so template defaults alone don't apply.
parameter_overrides = "ModelEndpoint=\"mantle\" MantleRegion=\"ap-south-1\" ModelIds=\"deepseek.v3.1,qwen.qwen3-235b-a22b-2507,qwen.qwen3-vl-235b-a22b-instruct\""
